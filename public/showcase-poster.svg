<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid meet"
     font-family="'Impact','Bebas Neue','Arial Black',system-ui,sans-serif" role="img"
     aria-label="Ridly Arcade showcase poster">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1224"/>
      <stop offset="55%"  stop-color="#121a36"/>
      <stop offset="100%" stop-color="#06091a"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="48%" r="60%">
      <stop offset="0%"  stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Coin gradient -->
    <radialGradient id="coin" cx="38%" cy="32%" r="72%">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="60%"  stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <!-- Pixel grid -->
    <pattern id="grid" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <circle cx="0" cy="0" r="0.7" fill="#1f2a4c" opacity="0.55"/>
    </pattern>
    <!-- Scanlines -->
    <pattern id="scanlines" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bg)"/>
  <rect width="800" height="1200" fill="url(#grid)"/>
  <rect width="800" height="1200" fill="url(#spot)"/>
  <rect width="800" height="1200" fill="url(#scanlines)"/>

  <!-- ===== Top marquee bar ===== -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="800" height="56" fill="#d92638"/>
    <rect x="0" y="56" width="800" height="3" fill="#fbbf24"/>
    <!-- Repeating arcade text -->
    <g fill="#fff8ec" font-size="22" font-weight="900" letter-spacing="6" font-style="italic">
      <text x="20"  y="38">RIDLY · ARCADE · RIDLY · ARCADE · RIDLY · ARCADE · RIDLY</text>
    </g>
    <!-- Mini bulbs -->
    <g fill="#fbbf24">
      <circle cx="20" cy="68" r="2.5"/><circle cx="60" cy="68" r="2.5"/><circle cx="100" cy="68" r="2.5"/>
      <circle cx="140" cy="68" r="2.5"/><circle cx="180" cy="68" r="2.5"/><circle cx="220" cy="68" r="2.5"/>
      <circle cx="260" cy="68" r="2.5"/><circle cx="300" cy="68" r="2.5"/><circle cx="340" cy="68" r="2.5"/>
      <circle cx="380" cy="68" r="2.5"/><circle cx="420" cy="68" r="2.5"/><circle cx="460" cy="68" r="2.5"/>
      <circle cx="500" cy="68" r="2.5"/><circle cx="540" cy="68" r="2.5"/><circle cx="580" cy="68" r="2.5"/>
      <circle cx="620" cy="68" r="2.5"/><circle cx="660" cy="68" r="2.5"/><circle cx="700" cy="68" r="2.5"/>
      <circle cx="740" cy="68" r="2.5"/><circle cx="780" cy="68" r="2.5"/>
    </g>
  </g>

  <!-- ===== Wordmark ===== -->
  <g transform="translate(400,200)" text-anchor="middle">
    <!-- "DIGITAL GAMING" eyebrow -->
    <text font-size="18" font-weight="800" letter-spacing="14" fill="#94a3b8" y="-58">DIGITAL · GAMING · STORE</text>
    <!-- Big RIDLY -->
    <text font-size="180" font-weight="900" letter-spacing="6" fill="#f59e0b" filter="url(#softGlow)" opacity="0.55" y="60">RIDLY</text>
    <text font-size="180" font-weight="900" letter-spacing="6" fill="#fbbf24" y="60">RIDLY</text>
    <!-- Underline -->
    <rect x="-160" y="80" width="320" height="6" fill="#d92638"/>
    <rect x="-160" y="92" width="320" height="2" fill="#fbbf24"/>
  </g>

  <!-- ===== Hero coin ===== -->
  <g transform="translate(400,470)">
    <!-- Glow -->
    <circle r="160" fill="#f59e0b" opacity="0.15" filter="url(#softGlow)"/>
    <!-- Coin rim -->
    <circle r="130" fill="#7c4a07"/>
    <circle r="130" fill="none" stroke="#7c4a07" stroke-width="2" stroke-dasharray="4 4"/>
    <!-- Coin face -->
    <circle r="108" fill="url(#coin)"/>
    <circle r="108" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <!-- Specular -->
    <ellipse cx="-30" cy="-44" rx="44" ry="22" fill="#ffffff" opacity="0.22"/>
    <!-- Star -->
    <path d="M 0,-55 L 16,-18 56,-12 28,16 35,55 0,36 -35,55 -28,16 -56,-12 -16,-18 Z"
          fill="#ffffff" opacity="0.95"/>
    <!-- Mini coins -->
    <g opacity="0.85">
      <g transform="translate(-180,40)">
        <circle r="34" fill="#7c4a07"/><circle r="28" fill="url(#coin)"/>
        <text text-anchor="middle" y="9" font-size="32" font-weight="900" fill="#fff">P</text>
      </g>
      <g transform="translate(180,40)">
        <circle r="34" fill="#7c4a07"/><circle r="28" fill="url(#coin)"/>
        <text text-anchor="middle" y="9" font-size="28" font-weight="900" fill="#fff">%</text>
      </g>
    </g>
  </g>

  <!-- ===== Tagline ===== -->
  <g transform="translate(400,710)" text-anchor="middle">
    <text font-size="32" font-weight="900" letter-spacing="6" fill="#e8f0ff">VOUCHERS · TOP-UPS · GACHA</text>
    <text y="40" font-size="16" font-weight="700" letter-spacing="4" fill="#94a3b8">SPIN · WIN · STACK YOUR POINTS</text>
  </g>

  <!-- ===== Scan box ===== -->
  <g transform="translate(400,930)">
    <!-- Card backdrop -->
    <rect x="-310" y="-100" width="620" height="220" rx="20" fill="#0e1730" stroke="#f59e0b" stroke-width="3"/>
    <rect x="-310" y="-100" width="620" height="220" rx="20" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="6 6" opacity="0.5"/>

    <!-- Left: text -->
    <g transform="translate(-260,-60)">
      <text font-size="14" font-weight="800" letter-spacing="5" fill="#d92638">▶ PLAY NOW</text>
      <text y="44" font-size="44" font-weight="900" letter-spacing="2" fill="#fbbf24">SCAN</text>
      <text y="84" font-size="44" font-weight="900" letter-spacing="2" fill="#fbbf24">TO VISIT</text>
      <text y="120" font-size="13" font-weight="700" letter-spacing="3" fill="#94a3b8">OR OPEN ON YOUR PHONE:</text>
      <text y="142" font-size="16" font-weight="900" letter-spacing="2" fill="#e8f0ff">ridly.example</text>
    </g>

    <!-- Right: QR area -->
    <g transform="translate(190,-80)">
      <rect width="180" height="180" rx="10" fill="#ffffff"/>
      <!-- Embedded QR: drop your real QR at public/showcase-qr.png to replace -->
      <image href="/showcase-qr.png" x="10" y="10" width="160" height="160"
             preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated;"/>
      <!-- Fallback hint visible only when href fails -->
      <text x="90" y="100" text-anchor="middle" font-size="11" font-weight="800" fill="#0a1224">
        DROP QR AT
      </text>
      <text x="90" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#0a1224">
        /showcase-qr.png
      </text>
    </g>
  </g>

  <!-- ===== Footer ===== -->
  <g transform="translate(0,1140)">
    <rect x="0" y="0" width="800" height="60" fill="#06091a"/>
    <rect x="0" y="0" width="800" height="3" fill="#d92638"/>
    <text x="400" y="38" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="6" fill="#94a3b8">
      RIDLY · DIGITAL GOODS · INSTANT DELIVERY · LEVEL UP
    </text>
  </g>

  <!-- Corner tags -->
  <g font-size="11" font-weight="900" letter-spacing="3" fill="#94a3b8">
    <text x="24" y="98">EST · 2026</text>
    <text x="776" y="98" text-anchor="end">SHOWCASE · BUILD</text>
  </g>
</svg>
